steps:
  # Build the image, passing the API key as a Docker build-arg
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--build-arg'
      - 'VITE_GEMINI_API_KEY=${_VITE_GEMINI_API_KEY}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/election-challenges'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'gcr.io/$PROJECT_ID/election-challenges'

images:
  - 'gcr.io/$PROJECT_ID/election-challenges'

# Substitutions (values provided at submit time via --substitutions)
substitutions:
  _VITE_GEMINI_API_KEY: ''   # override via --substitutions flag
